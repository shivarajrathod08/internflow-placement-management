server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:internflow_db}}}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: InternFlowHikariCP
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      dir: ${UPLOAD_DIR:/app/storage}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      bucket: ${S3_BUCKET_NAME:}
      access-key: ${S3_ACCESS_KEY_ID:}
      secret-key: ${S3_SECRET_ACCESS_KEY:}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
  demo:
    seed-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.internflow: INFO
    org.springframework.web: WARN
