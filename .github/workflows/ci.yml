name: InternFlow CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test-and-build:
    name: Backend Build & Unit/Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: internflow_db
          POSTGRES_USER: internflow_user
          POSTGRES_PASSWORD: internflow_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests & Package Backend
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: local
          DB_URL: jdbc:postgresql://localhost:5432/internflow_db
          DB_USERNAME: internflow_user
          DB_PASSWORD: internflow_password
          JWT_SECRET: c2VjdXJlLWVudGVycHJpc2Utand0LXNlY3JldC1rZXktaW50ZXJuZmxvdy0yMDI2LXByb2R1Y3Rpb24tbXVzdC1iZS0yNTYtYml0cw==
        run: mvn clean test package -B

  frontend-test-and-build:
    name: Frontend Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest Suite
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build Production Frontend Assets
        working-directory: ./frontend
        run: npm run build
