# ==============================================================================
# InternFlow Free-Tier Infrastructure Blueprint (Render IaC)
# 100% Free Tier - No Credit Card / Payment Required
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Spring Boot 3 + Java 21) - Free Tier
  # ----------------------------------------------------------------------------
  - type: web
    name: internflow-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Managed PostgreSQL Connection
      - key: DATABASE_URL
        fromDatabase:
          name: internflow-postgres
          property: connectionString
      # Security & JWT Token Generation
      - key: JWT_SECRET
        generateValue: true
      # CORS: Frontend Origin(s)
      - key: CORS_ALLOWED_ORIGINS
        value: https://internflow-frontend.onrender.com,https://internflow-web.onrender.com,http://localhost:5173
      # Storage Engine: Cloudflare R2 Private Object Storage (Free Tier: 10GB, $0 Egress)
      # Paid persistent disk removed to prevent unexpected charges.
      - key: STORAGE_TYPE
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_PATH_STYLE_ACCESS
        value: "true"
      # Cloudflare R2 credentials (Render prompts for these during Blueprint apply)
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React 18 + Vite + Tailwind CSS) - Free Tier
  # ----------------------------------------------------------------------------
  - type: web
    name: internflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://internflow-backend.onrender.com/api
      - key: VITE_ENABLE_DEMO_LOGIN
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database - Free Tier
# NOTE: Render's free PostgreSQL database expires 30 days after creation.
# For a permanent free database, see docs/DEPLOYMENT.md for Neon / Supabase setup.
# ------------------------------------------------------------------------------
databases:
  - name: internflow-postgres
    databaseName: internflow_db
    user: internflow_user
    plan: free
    region: oregon
    postgresMajorVersion: 16
