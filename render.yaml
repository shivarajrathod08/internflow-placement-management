# ==============================================================================
# InternFlow Production Infrastructure Blueprint (Render IaC)
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Spring Boot 3 + Java 21)
  # ----------------------------------------------------------------------------
  - type: web
    name: internflow-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Managed PostgreSQL Connection
      - key: DATABASE_URL
        fromDatabase:
          name: internflow-postgres
          property: connectionString
      # Security & JWT Token Generation
      - key: JWT_SECRET
        generateValue: true
      # CORS: Frontend Origin(s)
      - key: CORS_ALLOWED_ORIGINS
        value: https://internflow-frontend.onrender.com,https://internflow-web.onrender.com,http://localhost:5173
      # Storage Engine Configuration
      # Set to 's3' when Cloudflare R2 / AWS S3 credentials are provided below
      - key: STORAGE_TYPE
        value: local
      - key: UPLOAD_DIR
        value: /app/storage
      # Optional: Cloudflare R2 / AWS S3 Object Storage Credentials
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PATH_STYLE_ACCESS
        value: "true"
    # Persistent Disk for Local File Storage fallback
    disk:
      name: internflow-storage
      mountPath: /app/storage
      sizeGB: 1

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React 18 + Vite + Tailwind CSS)
  # ----------------------------------------------------------------------------
  - type: web
    name: internflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://internflow-backend.onrender.com/api
      - key: VITE_ENABLE_DEMO_LOGIN
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database (PostgreSQL 16)
# ------------------------------------------------------------------------------
databases:
  - name: internflow-postgres
    databaseName: internflow_db
    user: internflow_user
    plan: standard
    region: oregon
    postgresMajorVersion: 16
