# ==============================================================================
# InternFlow Zero-Paid-Service Demo Blueprint (Render IaC)
# 100% Free Tier - Uses Existing Free PostgreSQL Database
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Spring Boot 3 + Java 21) - Free Tier
  # ----------------------------------------------------------------------------
  - type: web
    name: internflow-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Existing Managed PostgreSQL Connection
      # Replace 'REPLACE_WITH_EXISTING_DATABASE_NAME' with the actual name of your existing Render database (e.g., 'internflow-postgres' or your existing DB name)
      - key: DATABASE_URL
        fromDatabase:
          name: REPLACE_WITH_EXISTING_DATABASE_NAME
          property: connectionString
      # Security & JWT Token Generation
      - key: JWT_SECRET
        generateValue: true
      # CORS: Frontend Origin(s)
      - key: CORS_ALLOWED_ORIGINS
        value: https://internflow-frontend.onrender.com,https://internflow-web.onrender.com,http://localhost:5173
      # Storage Engine: Local Storage (Demo Mode - Zero Configuration)
      # Uses container filesystem (/app/storage) for resume upload/view/download.
      # NOTE: Free-tier container storage is ephemeral and resets on restart/spin-down.
      - key: STORAGE_TYPE
        value: local
      - key: UPLOAD_DIR
        value: /app/storage

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React 18 + Vite + Tailwind CSS) - Free Tier
  # ----------------------------------------------------------------------------
  - type: web
    name: internflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://internflow-backend.onrender.com/api
      - key: VITE_ENABLE_DEMO_LOGIN
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
